# Crawls, tests and deploys Constant Reader to GitHub Pages.
#
# Scheduled runs crawl the press and rebuild web/data/feed.json. A push to main
# deploys the code change against the last feed without crawling. A manual run
# crawls unless told not to.
#
# The crawl is incremental. data/store.json, data/archive/, .cache/ and the
# last web/data/feed.json are carried between runs in the Actions cache. The
# first crawl starts from an empty cache and produces a much shallower feed
# until the store fills back up over a few weeks of runs.
#
# So a crawl never ships a feed with fewer than 90% of the live feed's books.
# Its state is still saved, so the store keeps accumulating, but the site keeps
# the live feed until the crawl catches up. A manual run with allow_shrink set
# skips the check.
#
# Seeding skips the wait: copy data/store.json and data/archive/ from a machine
# that has them into a fresh checkout, run "npm run build" there, and check the
# book count. Then upload data/ as a release asset named crawl-seed.tar.gz on
# a release tagged crawl-seed (tar czf crawl-seed.tar.gz data). A run whose
# cache is empty restores from it once. It contains review text, so delete the
# release after the first run has saved the cache.
#
# Secrets: GOOGLE_BOOKS_KEY (without it every Google Books lookup 429s).
# Settings: Pages > Source must be "GitHub Actions".

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 06:20 US Central (daylight time) on Monday, Wednesday and Saturday.
    - cron: '20 11 * * 1,3,6'
  workflow_dispatch:
    inputs:
      crawl:
        description: Crawl the press before deploying
        type: boolean
        default: true
      allow_shrink:
        description: Deploy the crawl even if it has far fewer books than the live feed
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Two crawls writing one archive would interleave their writes.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CRAWL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.crawl) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore crawl state
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            data
            web/data
          key: crawl-state-${{ github.run_id }}
          restore-keys: crawl-state-

      - name: Seed an empty cache
        if: env.CRAWL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/store.json ] && gh release view crawl-seed >/dev/null 2>&1; then
            gh release download crawl-seed --pattern crawl-seed.tar.gz
            tar xzf crawl-seed.tar.gz && rm crawl-seed.tar.gz
            echo "Seeded data/ from the crawl-seed release."
          fi

      - name: Crawl
        if: env.CRAWL == 'true'
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
        run: |
          if [ -n "$GOOGLE_BOOKS_KEY" ]; then printf '%s' "$GOOGLE_BOOKS_KEY" > google-books.key; fi
          before=$(stat -c %Y web/data/feed.json 2>/dev/null || echo 0)
          npm run build
          # The exit code is not enough on its own: build.mjs has thrown and still
          # exited 0, which left the old feed in place and said nothing.
          after=$(stat -c %Y web/data/feed.json 2>/dev/null || echo 0)
          [ "$after" -gt "$before" ] || { echo "::error::build wrote no new feed.json"; exit 1; }
          node -e 'const f=require("./web/data/feed.json");if(!Array.isArray(f.books)||!f.books.length)process.exit(1)' \
            || { echo "::error::feed.json is empty or unparseable"; exit 1; }
          rm -f google-books.key

      - name: Fall back to the live feed
        if: env.CRAWL != 'true'
        run: |
          # A code-only deploy with an empty cache still needs a feed to ship.
          if [ ! -f web/data/feed.json ]; then
            mkdir -p web/data
            curl -sSf https://www.constantreader.app/data/feed.json -o web/data/feed.json
          fi

      - name: Save crawl state
        if: env.CRAWL == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            data
            web/data
          key: crawl-state-${{ github.run_id }}

      # A crawl from a cold cache must not replace a deep live feed with a
      # shallow one. Checked after the state is saved, so the store still grows.
      - name: Keep the live feed if the crawl is shallow
        if: env.CRAWL == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.allow_shrink)
        run: |
          if curl -sSf https://www.constantreader.app/data/feed.json -o live-feed.json; then
            new=$(node -e 'console.log(require("./web/data/feed.json").books.length)')
            live=$(node -e 'console.log(require("./live-feed.json").books.length)')
            if [ $((new * 10)) -lt $((live * 9)) ]; then
              echo "::warning::The crawl found $new books against $live live. Deploying the live feed instead."
              cp live-feed.json web/data/feed.json
            fi
            rm -f live-feed.json
          fi

      - name: Test
        run: npm test

      # Reported, not gating: one fixture (The Nix) sits a point under its
      # tolerance today, and a scoring disagreement is a reason to look rather
      # than a reason to keep yesterday's feed live.
      - name: Calibrate
        continue-on-error: true
        run: npm run calibrate

      # ASK_URL is the Ask worker's address (see ask-worker.yml). Without it
      # the site ships keyword search only.
      - name: Assemble site
        env:
          ASK_URL: ${{ vars.ASK_URL }}
        run: npm run site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
