<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constant Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%20%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20fill%3D%27%23f0e9dc%27%2F%3E%3Cg%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%2713%27%20stroke%3D%27%237a6224%27%20stroke-width%3D%271.15%27%2F%3E%3Cg%20transform%3D%27rotate%28-7%2016%2017%29%27%3E%3Cpath%20d%3D%27M16%2020.4C13%2018.2%209.6%2017.4%206.2%2017.7l0-5.1C9.6%2012.3%2013%2013.1%2016%2015.3z%27%20stroke%3D%27%231a1613%27%20stroke-width%3D%271.15%27%2F%3E%3Cpath%20d%3D%27M16%2020.4c3-2.2%206.4-3%209.8-2.7l0-5.1C22.4%2012.3%2019%2013.1%2016%2015.3z%27%20stroke%3D%27%231a1613%27%20stroke-width%3D%271.15%27%2F%3E%3Cpath%20d%3D%27M16%2015.3v5.1%27%20stroke%3D%27%231a1613%27%20stroke-width%3D%271.15%27%2F%3E%3Cpath%20d%3D%27M6.2%2015.2c1.1-.2%202.2-.2%203.3%200M6.2%2013.9c1.1-.2%202.2-.2%203.3%200%27%20stroke%3D%27%239a2a24%27%20stroke-width%3D%27.85%27%2F%3E%3Cpath%20d%3D%27M25.8%2015.2c-1.1-.2-2.2-.2-3.3%200M25.8%2013.9c-1.1-.2-2.2-.2-3.3%200%27%20stroke%3D%27%239a2a24%27%20stroke-width%3D%27.85%27%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<meta name="description" content="Everything the literary press reviewed, scored out of ten against one reader's taste.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Courier+Prime:wght@400;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="app.css">

<!-- Added to a home screen this runs without Safari's chrome, so it needs a name,
     an opaque icon and a status-bar colour of its own. iOS ignores an SVG icon
     here and will screenshot the page instead, which is why the touch icon is a
     PNG. theme-color is declared per scheme so the notch area matches the page
     in both, rather than staying light behind a dark feed. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/constant-reader-180.png">
<meta name="apple-mobile-web-app-title" content="Constant Reader">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9ece8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171b1a" media="(prefers-color-scheme: dark)">
</head>
<body>
<a class="skip" href="#feed">Skip to the feed</a>

<div class="topbar" id="topbar">
<header class="masthead">
  <div class="wrap masthead-row">
    <h1 class="wordmark"><span class="mark" aria-hidden="true"></span><span class="wordmark-text">Constant Reader</span></h1>
    <div class="toolrow">
      <button class="btn tool" id="search-toggle" aria-label="Search" aria-expanded="false" aria-controls="panel-search"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.4"/><path d="M10.4 10.4 14 14" stroke-linecap="round"/></svg><span class="tool-dot" hidden aria-hidden="true"></span></button>
      <button class="btn tool" id="order-toggle" aria-label="Order" aria-expanded="false" aria-controls="panel-order"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4.5h9M2 8h6M2 11.5h3" stroke-linecap="round"/><path d="M12.5 5.5v7M10.5 10.5l2 2 2-2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tool-dot" hidden aria-hidden="true"></span></button>
      <button class="btn tool" id="filters-toggle" aria-label="Filters" aria-expanded="false" aria-controls="more"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M4.5 8h7M6.5 12h3" stroke-linecap="round"/></svg><span class="tool-dot" hidden aria-hidden="true"></span></button>
      <button class="btn tool tool-rec" id="recToggle" aria-pressed="false" aria-label="Show only recommended">
        <span class="rec-star" aria-hidden="true">★</span><span class="tool-n" id="recCount">0</span>
      </button>
    </div>

  </div>
</header>


<nav class="controls" aria-label="Sorting and filtering">
  <div class="wrap">
    <div class="field field-search toolpanel" id="panel-search" hidden>
      <label class="sr-only" for="q">Search</label>
      <input type="search" id="q" placeholder="title, author, publisher, critic" autocomplete="off">
    </div>
    <div class="field toolpanel" id="panel-order" hidden>
      <label class="sr-only" for="order">Order</label>
      <select id="order">
        <option value="latest">Newest reviews</option>
        <option value="fit">Best fit for me</option>
        <option value="published">Newest books</option>
        <option value="reviewed">Most reviewed</option>
        <option value="title">Title A–Z</option>
      </select>
    </div>

    <details id="more">
    <summary class="more-toggle sr-only">Filters <span class="more-count" id="more-count"></span></summary>
    <div class="controls-grid" style="margin-top:var(--s3)">
      <div class="field">
        <label for="minScore">Min score</label>
        <input type="number" id="minScore" min="1" max="10" step="0.5" placeholder="any">
      </div>
      <div class="field">
        <label for="minPages">Min pages</label>
        <input type="number" id="minPages" min="0" max="2000" step="50" placeholder="any">
      </div>
      <div class="group">
        <span class="legend" id="lg-src">Publication</span>
        <div class="chips" id="sources" role="group" aria-labelledby="lg-src"></div>
      </div>

    </div>

    <div class="toggle-row toggle-row-in-more" style="margin-top:var(--s3)">
      <label class="switch"><input type="checkbox" id="fWindow" checked> Inside the 10-year window</label>
      <label class="switch"><input type="checkbox" id="fNonfiction"> Hide nonfiction</label>
      <label class="switch"><input type="checkbox" id="fIdentity"> Only where the book is identified</label>
      <label class="switch"><input type="checkbox" id="fPenalised"> Only profile-penalised</label>
      <label class="switch"><input type="checkbox" id="fGroup"> Group by subject engine</label>
      <label class="switch"><input type="checkbox" id="fUnseen"> Hide what I've ruled on</label>
      <label class="switch"><input type="checkbox" id="fTune" checked> Tune scores from my saves</label>
      <button class="btn" id="reset">Reset filters</button>
    </div>
    <div class="more-done">
      <button class="btn btn-done" id="filters-done">Done</button>
    </div>
      <details id="tags-panel">
        <summary class="more-toggle">Browse tags</summary>
        <div id="tag-dir"></div>
      </details>
    </details>
  </div>
</nav>
</div>

<div class="dock">
  <div class="menu-panel" id="menu-panel" hidden>
    <nav class="views" aria-label="Sections">
      <button class="btn" id="view-feed" aria-current="page">Feed</button>
      <button class="btn" id="view-saved">Saved books <span class="n" id="savedCount">0</span></button>
      <button class="btn" id="view-taste">Taste</button>
      <button class="btn" id="view-profile">Profile <span class="nav-mark" id="profile-mark" hidden aria-hidden="true">•</span></button>
      <button class="btn" id="view-start">Build your profile</button>
      <button class="btn" id="theme" aria-label="Switch between light and dark">Theme</button>
    </nav>
    <p class="built" id="built"></p>
    <p class="sub" id="masthead-sub"></p>
  </div>
  <button class="to-top" id="to-top" hidden aria-label="Back to the top of the feed">
  <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M8 13V4M4 7.5 8 3.5l4 4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  </button>
  <button class="dock-btn" id="menu-toggle" aria-label="Sections and settings" aria-expanded="false" aria-controls="menu-panel">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M2 4h12M2 8h12M2 12h12" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<main class="wrap" id="main">
  <div class="tag-bar" id="tag-bar" hidden></div>
  <div class="tally">
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <section class="section" id="feed-section">
    <h2 id="feed" class="sr-only">Every book reviewed</h2>
    <p class="note" id="feed-note"></p>
    <div id="feed-body"></div>
  </section>

  <section class="section" id="saved-section" hidden>
    <div class="section-head">
      <h2 id="saved">Saved Books</h2>
      <div class="field">
        <label for="savedSort">Sort by</label>
        <select id="savedSort">
          <option value="recent">Recently saved</option>
          <option value="title">Title</option>
          <option value="author">Author</option>
        </select>
      </div>
    </div>
    <p class="status" id="saved-status" role="status" aria-live="polite"></p>
    <div id="saved-body"></div>
  </section>

  <section class="section" id="start-section" hidden>
    <div class="section-head">
      <h2 id="start">Build your profile</h2>
    </div>
    <div id="start-body"></div>
  </section>

  <section class="section" id="profile-section" hidden>
    <div class="section-head">
      <h2 id="profile">Your ordering</h2>
    </div>
    <div id="profile-body"></div>
  </section>

  <section class="section" id="taste-section" hidden>
    <div class="section-head">
      <h2 id="taste">What your saves have taught it</h2>
    </div>
    <div id="taste-body"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<footer class="foot wrap">
  <p id="foot-note"></p>
  <span style="display:flex;gap:var(--s2);flex-wrap:wrap">
    <button class="btn" id="export">Export my verdicts</button>
    <button class="btn" id="sources-info">Source status</button>
  </span>
</footer>

<script type="module" src="app.js"></script>

</body>
</html>
